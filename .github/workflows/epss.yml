name: EPSS Refresh

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  epss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build backend epss

      - name: Run EPSS sync (container)
        run: docker compose run --rm epss
